[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanium"
version = "0.0.0"
description = "City-agnostic, agent-extensible urban digital-twin and intelligence infrastructure"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "pyshacl>=0.40,<0.41",
  "rdflib>=7.3,<8",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
urbanium = ["semantics/shapes/*.ttl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "live: optional external-provider smoke tests excluded unless explicitly enabled",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["urbanium"]
