services:
  - type: web
    name: urbanium-demo
    runtime: python
    plan: free
    autoDeployTrigger: off
    buildCommand: python -m pip install .
    startCommand: URBANIUM_HOST=0.0.0.0 URBANIUM_PORT="$PORT" urbanium-api
    healthCheckPath: /api/v1/cities
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
