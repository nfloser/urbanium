name: Weekly live check

# Upstream sources can change formats, endpoints or inventories at any time.
# This job talks to them for real once a week, keeps a recording of what they
# answered and opens an issue when something no longer parses.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  # Validate changes to adapters and to the live checks against the real sources.
  pull_request:
    paths:
      - "src/urbanium/providers/**"
      - "tests/live/**"
      - ".github/workflows/live-check.yml"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Live smoke tests
        env:
          URBANIUM_LIVE_AREA: "1"
          URBANIUM_LIVE_DWD: "1"
          URBANIUM_LIVE_DWD_STATIONS: "1"
          URBANIUM_LIVE_VBB: "1"
        run: pytest -m live -ra tests/live
      - name: Record real upstream responses
        if: always()
        run: urbanium-twin build --record recording --out snapshots
      - name: Keep the recording for regression fixtures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-recording
          path: |
            recording
            snapshots
          retention-days: 30
      - name: Report a failing source
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Weekly live check failed" \
            --body "An upstream source no longer answered as expected. Logs and the recording: $RUN_URL"
