name: Browser demo

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Refresh the live twin snapshots twice an hour (off the hour to avoid peak load).
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Builds on main run one after another, so archive commits never race.
concurrency:
  group: browser-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Build the source catalogue
        run: python demo/build.py _site/catalog
      - name: Fetch the previously published snapshots
        # Missing on the first deployment; the build then simply has nothing to carry.
        continue-on-error: true
        env:
          PAGES: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data
        run: |
          mkdir -p previous
          for dir in cities/*/; do
            id=$(basename "$dir")
            curl -fsSL --max-time 20 "$PAGES/$id.json" -o "previous/$id.json" || rm -f "previous/$id.json"
          done
      - name: Read the observation archive
        # Read-only: the data branch may not exist yet; the build then starts a new archive.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        continue-on-error: true
        with:
          ref: data
          path: history
          persist-credentials: false
      - name: Pick this week's static GTFS cache key
        id: week
        run: echo "key=gtfs-static-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Reuse the static GTFS archive of this week
        # The static feed changes weekly and is ~80 MB; the build refreshes it after 7 days.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache
          key: ${{ steps.week.outputs.key }}
      - name: Build live twin snapshots
        run: |
          mkdir -p history/archive
          urbanium-twin build --out _site/data --previous previous --history history/archive --cache .cache
      - name: Hand the updated archive to the archive job
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: observation-archive
          path: history/archive
          retention-days: 2
      - name: Add the Twin Explorer
        run: cp -r demo/explorer/. _site/
      - name: Pick this month's basemap cache key
        id: month
        run: echo "key=basemap-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Reuse this month's basemap extracts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: basemap
          key: ${{ steps.month.outputs.key }}-${{ hashFiles('cities/*/city.yaml') }}
      - name: Extract self-hosted basemaps
        # Optional: without extracts the explorer falls back to CARTO raster tiles.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.31.2 --repo protomaps/go-pmtiles --pattern '*Linux_x86_64.tar.gz' --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP"/*Linux_x86_64.tar.gz -C "$RUNNER_TEMP" pmtiles
          PATH="$RUNNER_TEMP:$PATH" python demo/basemaps.py basemap
      - name: Publish the basemaps next to the explorer
        run: |
          mkdir -p _site/basemap
          cp basemap/*.pmtiles _site/basemap/ 2>/dev/null || echo "no basemap extracts; CARTO fallback"
      - name: Keep the built site for pull request review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twin-explorer-preview
          path: _site
          retention-days: 7
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deploy

  archive:
    # The only job that writes, and it never runs pull request code.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: observation-archive
          path: ${{ runner.temp }}/archive
      - name: Commit the archive to the data branch
        env:
          INCOMING: ${{ runner.temp }}/archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=1 origin data; then
            git switch -c data FETCH_HEAD
          else
            git switch --orphan data
          fi
          mkdir -p archive
          cp -r "$INCOMING"/. archive/
          git add archive
          if git diff --cached --quiet; then
            echo "archive unchanged"
          else
            git commit -qm "Archive observations $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin data
          fi
