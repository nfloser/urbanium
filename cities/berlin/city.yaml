schema_version: "1"
id: berlin
name: Berlin
country_code: DE
timezone: Europe/Berlin
# Search envelope for source discovery, not an administrative boundary.
area:
  south: 52.338
  west: 13.088
  north: 52.676
  east: 13.761
capabilities:
  - id: weather
    support: configured
    notes: DWD CDC 10-minute air temperature is bound through the shared weather adapter.
  - id: realtime_transport
    support: configured
    notes: VBB publishes GTFS-Realtime for Berlin/Brandenburg.
  - id: river_level
    support: configured
    notes: Federal waterway gauges inside the city area are discovered through PEGELONLINE.
  - id: open_data_catalog
    support: configured
    notes: Berlin operates a central open-data catalogue with machine-readable metadata.
sources:
  - id: dwd_open_data
    provider: Deutscher Wetterdienst
    domain: weather
    protocol: https
    status: verified
    authority: authoritative
    capabilities: [weather]
    endpoint: https://opendata.dwd.de/
    update_frequency: hourly
    license:
      identifier: CC BY 4.0
      terms_url: https://www.dwd.de/DE/leistungen/opendata/hilfe.html
      redistribution: permitted
      notes: Attribution and notice requirements apply to DWD CDC data.
  - id: vbb_gtfs_rt
    provider: Verkehrsverbund Berlin-Brandenburg
    domain: mobility
    protocol: gtfs_rt
    status: verified
    authority: authoritative
    capabilities: [realtime_transport]
    endpoint: https://production.gtfsrt.vbb.de/data
    update_frequency: realtime
    license:
      identifier: CC BY 4.0
      terms_url: https://unternehmen.vbb.de/digitale-services/datensaetze/
      redistribution: permitted
      notes: Attribution requirements remain with the upstream feed.
  - id: pegelonline
    provider: Wasserstraßen- und Schifffahrtsverwaltung des Bundes (PEGELONLINE)
    domain: water
    protocol: https
    status: verified
    authority: authoritative
    capabilities: [river_level]
    endpoint: https://www.pegelonline.wsv.de/webservices/rest-api/v2/
    update_frequency: near-realtime
    license:
      identifier: DL-DE->Zero-2.0
      terms_url: https://www.pegelonline.wsv.de/gast/nutzungsbedingungen
      redistribution: permitted
      notes: Raw, unchecked gauge values; WSV excludes liability for accuracy and timeliness.
  - id: vbb_gtfs_static
    provider: Verkehrsverbund Berlin-Brandenburg
    domain: mobility
    protocol: gtfs
    status: verified
    authority: authoritative
    capabilities: [realtime_transport]
    endpoint: https://unternehmen.vbb.de/fileadmin/user_upload/VBB/Dokumente/API-Datensaetze/gtfs-mastscharf/GTFS.zip
    update_frequency: weekly
    license:
      identifier: CC BY 4.0
      terms_url: https://unternehmen.vbb.de/digitale-services/datensaetze/
      redistribution: permitted
      notes: Stop-level GTFS; used only to locate stop ids named in GTFS-Realtime alerts. Each run reports how many alert stop ids the inventory does not contain.
  - id: berlin_open_data
    provider: Land Berlin
    domain: open_data
    protocol: ckan
    status: verified
    authority: authoritative
    capabilities: [open_data_catalog]
    endpoint: https://daten.berlin.de/
    update_frequency: dataset-specific
    license:
      terms_url: https://daten.berlin.de/
      redistribution: unknown
      notes: Individual datasets retain their own licences; catalogue access does not relicense them.
