schema_version: "1"
id: hamburg
name: Hamburg
country_code: DE
timezone: Europe/Berlin
# Search envelope for source discovery, not an administrative boundary.
area:
  south: 53.395
  west: 9.73
  north: 53.74
  east: 10.33
# Added with configuration only: nationwide sources discover their entities in the area.
capabilities:
  - id: weather
    support: configured
    notes: DWD stations inside the city area are discovered from the national inventory.
  - id: river_level
    support: configured
    notes: Elbe and Hamburg port gauges inside the city area are discovered through PEGELONLINE.
sources:
  - id: dwd_open_data
    provider: Deutscher Wetterdienst
    domain: weather
    protocol: https
    status: verified
    authority: authoritative
    capabilities: [weather]
    endpoint: https://opendata.dwd.de/
    update_frequency: hourly
    license:
      identifier: CC BY 4.0
      terms_url: https://www.dwd.de/DE/leistungen/opendata/hilfe.html
      redistribution: permitted
      notes: Attribution and notice requirements apply to DWD CDC data.
  - id: pegelonline
    provider: Wasserstraßen- und Schifffahrtsverwaltung des Bundes (PEGELONLINE)
    domain: water
    protocol: https
    status: verified
    authority: authoritative
    capabilities: [river_level]
    endpoint: https://www.pegelonline.wsv.de/webservices/rest-api/v2/
    update_frequency: near-realtime
    license:
      identifier: DL-DE->Zero-2.0
      terms_url: https://www.pegelonline.wsv.de/gast/nutzungsbedingungen
      redistribution: permitted
      notes: Raw, unchecked gauge values; WSV excludes liability for accuracy and timeliness.
