<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urbanium Twin Explorer</title>
<meta name="description" content="Stadtzwilling aus offenen Daten: Wetterstationen, Pegel, Beziehungen und abgeleitetes Wissen mit Herkunft.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%2315263a%22/%3E%3Ccircle cx=%225.5%22 cy=%2210%22 r=%222.5%22 fill=%22%23e8edee%22/%3E%3Crect x=%229%22 y=%223%22 width=%224%22 height=%224%22 transform=%22rotate(45 11 5)%22 fill=%22%231f6fb2%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <a class="wordmark" href="./" aria-label="Urbanium Twin Explorer">Urbanium</a>
    <nav class="cities" id="cities" aria-label="Stadt wählen"></nav>
    <nav class="views" aria-label="Ansicht">
      <button type="button" data-view="map" aria-pressed="true">Karte</button>
      <button type="button" data-view="graph" aria-pressed="false">Wissensgraph</button>
      <button type="button" data-view="compare" aria-pressed="false">Städte</button>
    </nav>
    <p class="stamp" id="stamp" role="status"></p>
  </header>

  <div class="notice" id="notice" hidden></div>

  <aside class="rail" aria-label="Ebenen und Erkenntnisse">
    <section class="rail-block" aria-labelledby="layers-title">
      <h2 id="layers-title">Ebenen</h2>
      <ul class="layers" id="layers"></ul>
    </section>
    <section class="rail-block insights" aria-labelledby="insights-title">
      <h2 id="insights-title">Erkenntnisse</h2>
      <p class="hint">Von Agenten aus den Messdaten berechnet. Ocker markiert abgeleitetes Wissen.</p>
      <div id="insights"></div>
    </section>
    <footer class="credits" id="credits"></footer>
  </aside>

  <main class="stage" id="stage">
    <div class="view view-map" id="view-map">
      <div id="map" class="map" role="region" aria-label="Karte der Messstellen"></div>
      <div class="legend" id="legend" aria-hidden="true"></div>
    </div>
    <div class="view view-graph" id="view-graph" hidden>
      <div class="graph-head">
        <p>Jede Linie ist eine Aussage mit Herkunft. Blau stammt direkt aus der Quelle, Ocker wurde abgeleitet.</p>
        <a id="turtle-link" class="quiet-link" href="#" download>Graph als Turtle laden</a>
      </div>
      <svg id="graph" class="graph" role="group" aria-label="Wissensgraph der Stadt"></svg>
    </div>
    <div class="view view-compare" id="view-compare" hidden></div>
  </main>

  <aside class="detail" id="detail" aria-label="Details zur Auswahl" aria-live="polite"></aside>
</div>
<noscript>Der Twin Explorer braucht JavaScript.</noscript>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
